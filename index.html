<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Millones y Mitos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyM Studio">
<meta name="theme-color" content="#070B14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#070B14; --s1:#0D1422; --s2:#131C2E; --line:#1D2840; --line2:#26334F;
  --tx:#EEF2F8; --mut:#8C98AE; --dim:#5D6982;
  --gold:#E3B24C; --gold2:#F4D27E; --goldbg:rgba(227,178,76,.12);
  --blue:#4AA8FF; --bluebg:rgba(74,168,255,.12);
  --green:#3DD68C; --greenbg:rgba(61,214,140,.12);
  --red:#FF6B6B; --redbg:rgba(255,107,107,.12);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* Header */
header{position:sticky;top:0;z-index:20;background:rgba(7,11,20,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 20px 10px}
.hd{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hd img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 1px rgba(227,178,76,.35),0 0 18px rgba(74,168,255,.18)}
.hd .nm{font-weight:700;font-size:16px;letter-spacing:.2px}
.hd .sb{font-size:12px;color:var(--mut)}
.hd .subs{margin-left:auto;text-align:right}
.hd .subs b{display:block;font-size:26px;line-height:1;color:var(--gold);font-weight:750;letter-spacing:-.5px}
.hd .subs span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
.icobtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;cursor:pointer;flex:none}
.icobtn svg{width:18px;height:18px;stroke:var(--mut)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:6px}
.sync.ok{background:var(--green)} .sync.busy{background:var(--gold);animation:p 1s infinite} .sync.err{background:var(--red)}
@keyframes p{50%{opacity:.3}}

main{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.4px}
.sub{color:var(--mut);margin:0 0 18px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:600;margin:0 0 12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.hl{border-color:rgba(227,178,76,.45);background:linear-gradient(180deg,rgba(227,178,76,.07),var(--s1) 60%)}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.6px;margin-top:2px}
.kpi .d{font-size:12px;margin-top:2px}
.up{color:var(--green)} .down{color:var(--red)} .mut{color:var(--mut)} .gold{color:var(--gold)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--s2);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.chip.g{background:var(--goldbg);color:var(--gold2);border-color:transparent}
.chip.b{background:var(--bluebg);color:var(--blue);border-color:transparent}
.chip.ok{background:var(--greenbg);color:var(--green);border-color:transparent}
.chip.bad{background:var(--redbg);color:var(--red);border-color:transparent}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--gold);color:#1A1203}
.btn.sec{background:var(--s2);color:var(--tx);border:1px solid var(--line2)}
.btn.ghost{background:none;color:var(--mut);padding:8px 10px}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn:active{transform:scale(.98)}
.bar{height:6px;border-radius:99px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.bar.b i{background:var(--blue)} .bar.g i{background:var(--green)}

/* checklist */
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.chk:last-child{border-bottom:0}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;margin-top:1px;transition:.15s}
.chk.on .box{background:var(--gold);border-color:var(--gold)}
.chk.on .box:after{content:"";width:6px;height:11px;border:solid #1A1203;border-width:0 2.4px 2.4px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk.on .t{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--dim)}
.chk .t small{display:block;color:var(--dim);font-size:12px;text-decoration:none}

/* list */
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.vrow{cursor:pointer}
.vnum{width:30px;height:30px;border-radius:9px;background:var(--s2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mut);flex:none}
.vt{font-weight:600;line-height:1.3}
.vm{font-size:12px;color:var(--mut);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vbar{margin-top:8px}
.big{font-size:20px;font-weight:700;text-align:right;min-width:70px}
.big small{display:block;font-size:11px;color:var(--mut);font-weight:500}

.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;color:var(--mut);font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--s2);color:var(--tx)}

/* tab bar */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(10,15,26,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px}
nav a{flex:1;max-width:120px;text-decoration:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 0;border-radius:12px}
nav a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--gold)}

/* analysis */
.nota{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;border:2px solid var(--gold);color:var(--gold)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:14px 0}
.m{background:var(--s2);border-radius:12px;padding:10px 12px}
.m .l{font-size:11px;color:var(--mut)} .m .v{font-weight:700;font-size:17px} .m .c{font-size:11px;color:var(--green)}
.ul{margin:0;padding:0;list-style:none}
.ul li{padding:5px 0 5px 20px;position:relative;font-size:14px}
.ul.ok li:before{content:"";position:absolute;left:2px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.ul.ko li:before{content:"";position:absolute;left:2px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--red)}
details summary{cursor:pointer;color:var(--blue);font-size:13px;font-weight:600;list-style:none;margin-top:10px}
details summary::-webkit-details-marker{display:none}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
@media(min-width:700px){.ov{align-items:center}}
.sheet{background:var(--s1);border:1px solid var(--line2);border-radius:22px 22px 0 0;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:22px 22px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{border-radius:22px}}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:12px;color:var(--mut);font-weight:600}
.f input,.f textarea,.f select{background:var(--s2);border:1px solid var(--line2);border-radius:11px;padding:11px 12px;outline:none;width:100%}
.f input:focus,.f textarea:focus{border-color:var(--gold)}
.f textarea{min-height:90px;resize:vertical}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px}
@media(min-width:560px){.fg.c4{grid-template-columns:repeat(4,1fr)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--s2);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{color:var(--mut);text-align:center;padding:26px 10px;font-size:14px}
.streak{display:flex;align-items:center;gap:14px}
.flame{font-size:34px;line-height:1}
.dots{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:4px;background:var(--s2);border:1px solid var(--line)}
.dots i.on{background:var(--gold);border-color:var(--gold)}
.dots i.comp{background:transparent;border:2px solid var(--gold)}
.dots i.today{outline:2px solid var(--blue);outline-offset:1px}
svg.chart text{fill:var(--mut);font-size:11px}
.setup{max-width:520px;margin:40px auto;text-align:center}
.setup img{width:110px;border-radius:50%;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <div class="hd">
    <img src="logo.png" alt="Logo de Millones y Mitos">
    <div>
      <div class="nm">Millones y Mitos</div>
      <div class="sb"><span class="sync" id="sync"></span><span id="synctx">—</span></div>
    </div>
    <div class="subs"><b class="num" id="hsubs">—</b><span>suscriptores</span></div>
    <button class="icobtn" id="btnAjustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main id="main"></main>

<nav id="nav">
  <a href="#hoy" data-t="hoy"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hoy</a>
  <a href="#videos" data-t="videos"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>Vídeos</a>
  <a href="#ideas" data-t="ideas"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9V16h5v-.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3z"/></svg>Ideas</a>
  <a href="#analisis" data-t="analisis"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Análisis</a>
  <a href="#dinero" data-t="dinero"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 8.5c-.6-.9-1.7-1.5-3-1.5-1.9 0-3 1-3 2.3 0 3 6 1.6 6 4.6 0 1.3-1.2 2.3-3 2.3-1.4 0-2.6-.6-3.2-1.6M12 5.5v13"/></svg>Dinero</a>
</nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- estado ---------- */
const LS_API='mym-api', LS_DATA='mym-data';
let API=null, CLAVE=null, D=null;
const ui={vsort:'reciente', ifil:'pendiente', afil:'todos'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

/* ---------- fechas y números ---------- */
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function hoyStr(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){if(!s)return null;const[a,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(a,m-1,d)}
function dias(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function addD(s,n){const d=pd(s);d.setDate(d.getDate()+n);return hoyStr(d)}
function fCorta(s){const d=pd(s);return d?d.getDate()+' '+MES[d.getMonth()]:''}
function fLarga(s){const d=pd(s);return DIA[d.getDay()].replace(/^./,c=>c.toUpperCase())+' '+d.getDate()+' de '+['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()]}
const nf={format:x=>{x=+x;const neg=x<0;x=Math.abs(x);let[i,d]=(Math.round(x*10)/10).toString().split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return(neg?'-':'')+i+(d?','+d:'')}};
function n(v){return v===''||v==null||isNaN(v)?'—':nf.format(+v)}
function nk(v){if(v===''||v==null||isNaN(v))return'—';v=+v;if(v>=1e6)return(v/1e6).toLocaleString('es-ES',{maximumFractionDigits:1})+' M';if(v>=1e4)return(v/1e3).toLocaleString('es-ES',{maximumFractionDigits:1})+' K';return nf.format(v)}
function pct(v){return v===''||v==null||isNaN(v)?'—':(+v).toLocaleString('es-ES',{maximumFractionDigits:1})+' %'}
function num(v){return v===''||v==null||isNaN(+v)?null:+v}

/* ---------- sincronización ---------- */
function setSync(st,tx){$('#sync').className='sync '+st;$('#synctx').textContent=tx}
function guardarLocal(){lsSet(LS_DATA,JSON.stringify(D))}
async function cargar(silencioso){
  if(!API){return}
  setSync('busy','Sincronizando…');
  try{
    const r=await fetch(API+'?clave='+encodeURIComponent(CLAVE)+'&t='+Date.now());
    const j=await r.json();
    if(j.error)throw new Error(j.error);
    D=normalizar(j);guardarLocal();render();
    setSync('ok','Al día · '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSync('err','Sin conexión · datos guardados');if(!silencioso)toast('No se pudo sincronizar')}
}
async function enviar(cuerpo){
  if(!API)return;
  setSync('busy','Guardando…');
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({clave:CLAVE,...cuerpo})});
    const j=await r.json();
    if(j.error)throw new Error(j.error);
    D=normalizar(j);guardarLocal();render();
    setSync('ok','Guardado · '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSync('err','No se guardó');toast('No se pudo guardar. Revisa la conexión.')}
}
function normalizar(j){
  const o={canal:j.canal||{},videos:j.videos||[],analisis:j.analisis||[],ideas:j.ideas||[],historial:j.historial||[]};
  const fx=f=>{if(f==null||f==='')return'';const t=String(f);if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;const d=new Date(t);return isNaN(d)?t.slice(0,10):hoyStr(d)};
  ['videos','analisis','historial'].forEach(k=>o[k].forEach(x=>{x.fecha=fx(x.fecha)}));
  o.videos.forEach(v=>{v.final=v.final===true||v.final==='TRUE'||v.final==='true'});
  o.historial.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
  return o;
}
/* cambios locales inmediatos + envío */
function guardarFila(hoja,fila,llave='id'){
  const arr=D[hoja];const i=arr.findIndex(x=>x[llave]===fila[llave]);
  if(i>=0)arr[i]={...arr[i],...fila};else arr.push(fila);
  guardarLocal();render();enviar({accion:'guardar',hoja,fila});
}
function borrarFila(hoja,id){
  D[hoja]=D[hoja].filter(x=>x.id!==id);guardarLocal();render();enviar({accion:'borrar',hoja,id});
}

/* ---------- cálculos ---------- */
function videos(){return [...D.videos].sort((a,b)=>(+b.num||0)-(+a.num||0))}
function compensados(){const c=D.canal.diasCompensados;if(Array.isArray(c))return c.map(String);return String(c||'').split(',').map(x=>x.trim()).filter(Boolean)}
function racha(){
  const set=new Set([...D.videos.map(v=>String(v.fecha).slice(0,10)),...compensados()]);
  let d=hoyStr();if(!set.has(d))d=addD(d,-1);
  let c=0;while(set.has(d)){c++;d=addD(d,-1)}
  return c;
}
function reto(){
  const ini=D.canal.inicioReto||'2026-11-02', fin=D.canal.finReto||'2026-12-31', pdia=+D.canal.videosPorDia||1;
  const total=(dias(ini,fin)+1)*pdia;
  const hechos=D.videos.filter(v=>String(v.fecha)>=ini&&String(v.fecha)<=fin).length;
  const transcurridos=Math.max(0,Math.min(dias(ini,hoyStr())+1,dias(ini,fin)+1))*pdia;
  const lunes=(()=>{const d=pd(hoyStr());const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return hoyStr(d)})();
  const semana=D.videos.filter(v=>String(v.fecha)>=lunes&&String(v.fecha)<=addD(lunes,6)).length;
  return{ini,fin,total,hechos,transcurridos,semana,lunes,quedan:dias(hoyStr(),fin)};
}
function pendientesAnalisis(){
  const h=hoyStr();
  return D.videos.filter(v=>!v.final&&v.fecha).map(v=>({v,dia:addD(v.fecha,7),falta:dias(h,addD(v.fecha,7))}))
    .filter(x=>x.falta<=3).sort((a,b)=>a.falta-b.falta);
}
function ultimoHist(){const h=D.historial;return{u:h[h.length-1]||{},p:h[h.length-2]||{}}}
function ritmoSubs(){
  const h=D.historial;if(h.length<2)return null;
  const u=h[h.length-1];
  let base=h[0];for(const x of h){if(dias(x.fecha,u.fecha)<=7){base=x;break}}
  const d=dias(base.fecha,u.fecha);if(d<=0)return null;
  return (u.subs-base.subs)/d;
}

/* ---------- vistas ---------- */
function render(){
  const subs=D.canal.subs;$('#hsubs').textContent=n(subs);
  const t=(location.hash||'#hoy').slice(1);
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===t));

function vDinero(){
  const s=+D.canal.subs||0, v28=+D.canal.vistas28||0, h28=+D.canal.horas28||0;
  const hoy=hoyStr(), sub90=D.videos.filter(v=>v.fecha&&dias(v.fecha,hoy)<=90).length;
  const v90=Math.max(v28,D.videos.filter(v=>v.fecha&&dias(v.fecha,hoy)<=90).reduce((a,v)=>a+(num(v.vistas)||0),0));
  const rit=ritmoSubs();
  const fecha=obj=>{if(!rit||rit<=0||s>=obj)return null;const d=Math.ceil((obj-s)/rit);const f=pd(hoy);f.setDate(f.getDate()+d);return{d,f}};
  const f500=fecha(500), f1000=fecha(1000);
  const HITOS=[10,25,50,100,250,500,1000,10000];const sig=HITOS.find(x=>x>s)||s;
  const ritV=v28/28*90;
  const barra=(l,a,b,cls='')=>`<div style="margin:12px 0"><div class="row" style="font-size:14px"><span>${l}</span><span class="sp"></span><span class="num ${a>=b?'up':'mut'}">${nk(a)} / ${nk(b)}</span></div><div class="bar ${cls}" style="margin-top:6px"><i style="width:${Math.min(100,a/b*100)}%"></i></div></div>`;
  const fTxt=x=>x?`${x.f.getDate()} ${MES[x.f.getMonth()]} ${x.f.getFullYear()} <span class="mut">(${x.d} días)</span>`:'—';
  return `
  <h1>Camino a monetizar</h1><p class="sub">Requisitos del Programa de Partners de YouTube para Shorts.</p>
  <div class="grid g3">
    <div class="card hl kpi"><div class="l">Próximo hito</div><div class="v num gold">${n(sig)} subs</div><div class="d mut">Te faltan ${n(Math.max(0,sig-s))}</div><div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,s/sig*100)}%"></i></div></div>
    <div class="card kpi"><div class="l">Ritmo actual</div><div class="v num">${rit!=null?rit.toLocaleString('es-ES',{maximumFractionDigits:1}):'—'}</div><div class="d mut">suscriptores al día (última semana)</div></div>
    <div class="card kpi"><div class="l">A este ritmo, 500 subs el…</div><div class="v num" style="font-size:20px;margin-top:6px">${fTxt(f500)}</div><div class="d mut">1.000 subs: ${f1000?f1000.f.getDate()+' '+MES[f1000.f.getMonth()]+' '+f1000.f.getFullYear():'—'}</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card">
      <div class="row"><h2 style="margin:0">Nivel 1 · ingresos por fans</h2><span class="sp"></span><span class="chip g">Primero</span></div>
      <p class="mut" style="font-size:13px;margin:6px 0 0">Membresías, Super Thanks, Super Chat y tienda.</p>
      ${barra('Suscriptores',s,500)}
      ${barra('Vídeos públicos en 90 días',sub90,3,'g')}
      ${barra('Vistas de Shorts en 90 días',v90,3e6,'b')}
    </div>
    <div class="card">
      <div class="row"><h2 style="margin:0">Nivel 2 · anuncios</h2><span class="sp"></span><span class="chip">Después</span></div>
      <p class="mut" style="font-size:13px;margin:6px 0 0">Reparto de ingresos de los anuncios del feed de Shorts.</p>
      ${barra('Suscriptores',s,1000)}
      ${barra('Vistas de Shorts en 90 días',v90,1e7,'b')}
      <p class="mut" style="font-size:12px;margin:10px 0 0">Desde el 1 feb 2027 YouTube sube este nivel a 20 M de vistas de Shorts en 90 días. Las horas vistas en Shorts no cuentan para la vía de horas.</p>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="row"><h2 style="margin:0">Suscriptores</h2><span class="sp"></span><span class="mut" style="font-size:12px">Ritmo de vistas: ~${nk(Math.round(ritV))} cada 90 días</span></div>
    ${grafica()}
  </div>
  <p class="mut" style="font-size:12px;margin-top:12px">Vistas de 90 días aproximadas a partir de tus vídeos. Horas vistas (28 d): ${n(h28)}.</p>`;
}
function grafica(){
  const h=D.historial.filter(x=>x.subs!==''&&x.subs!=null);if(h.length<2)return`<div class="empty">Hace falta más historial.</div>`;
  const W=1000,H=220,P={l:36,r:16,t:16,b:26};
  const x0=pd(h[0].fecha),x1=pd(h[h.length-1].fecha),span=Math.max(1,(x1-x0)/864e5);
  const max=Math.max(...h.map(x=>+x.subs))*1.15;
  const X=f=>P.l+((pd(f)-x0)/864e5)/span*(W-P.l-P.r), Y=v=>H-P.b-(v/max)*(H-P.t-P.b);
  const pts=h.map(x=>[X(x.fecha),Y(+x.subs)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0]} ${H-P.b} L${pts[0][0]} ${H-P.b} Z`;
  const ticks=[0,Math.round(max/2),Math.round(max)];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:12px" role="img" aria-label="Evolución de suscriptores">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3B24C" stop-opacity=".28"/><stop offset="1" stop-color="#E3B24C" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="#1D2840"/><text x="${P.l-8}" y="${Y(t)+4}" text-anchor="end">${t}</text>`).join('')}
    <path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="#E3B24C" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'#E3B24C':'#0D1422'}" stroke="#E3B24C" stroke-width="2"/>`).join('')}
    <text x="${pts[pts.length-1][0]-6}" y="${pts[pts.length-1][1]-12}" text-anchor="end" style="fill:#F4D27E;font-weight:700;font-size:13px">${h[h.length-1].subs}</text>
    <text x="${P.l}" y="${H-6}">${fCorta(h[0].fecha)}</text><text x="${W-P.r}" y="${H-6}" text-anchor="end">${fCorta(h[h.length-1].fecha)}</text>
  </svg>`;
}

/* ---------- ajustes y conexión ---------- */
function abrir(html){$('#sheet').innerHTML=html;$('#ov').classList.add('on')}
function cerrar(){$('#ov').classList.remove('on')}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')cerrar()});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}
function ajustes(){
  abrir(`
    <div class="row"><h1 style="font-size:20px;margin:0">Ajustes</h1><span class="sp"></span><button class="btn ghost" onclick="cerrar()">Cerrar</button></div>
    <div style="margin-top:16px">
      <div class="f"><label for="ac">Código de conexión</label><input id="ac" value="${esc(API?API+'?clave='+CLAVE:'')}" placeholder="https://script.google.com/…/exec?clave=…" autocapitalize="off" autocorrect="off"></div>
      <div class="row" style="gap:8px"><button class="btn" onclick="conectar($('#ac').value)">Guardar y conectar</button><button class="btn sec" onclick="cerrar();cargar()">Sincronizar ahora</button></div>
      <p class="mut" style="font-size:12px;margin-top:16px">Los datos viven en tu hoja de Google “Millones y Mitos · Datos de la app”. Clau los actualiza cuando le mandas capturas.</p>
    </div>`);
}
$('#btnAjustes').onclick=ajustes;
function conectar(txt){
  try{
    const u=new URL(String(txt).trim());const k=u.searchParams.get('clave');
    if(!k||!u.hostname.endsWith('google.com'))throw 0;
    API=u.origin+u.pathname;CLAVE=k;lsSet(LS_API,JSON.stringify({API,CLAVE}));
    cerrar();toast('Conectado');cargar();
  }catch(e){toast('Ese código no parece correcto')}
}
function pantallaInicial(){
  $('#main').innerHTML=`<div class="setup card">
    <img src="logo.png" alt="">
    <h1>Bienvenido, Rubén</h1>
    <p class="mut">Pega aquí el código de conexión que te ha dado Clau. Solo hace falta una vez.</p>
    <div class="f" style="text-align:left"><input id="ac0" placeholder="https://script.google.com/…/exec?clave=…" autocapitalize="off" autocorrect="off"></div>
    <button class="btn" style="width:100%" onclick="conectar($('#ac0').value)">Conectar</button>
  </div>`;
  setSync('', 'Sin conectar');
}

/* ---------- arranque ---------- */
window.addEventListener('hashchange',()=>{if(D){render();scrollTo(0,0)}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&API)cargar(true)});
(function(){
  try{const c=JSON.parse(lsGet(LS_API)||'null');if(c){API=c.API;CLAVE=c.CLAVE}}catch(e){}
  try{const d=JSON.parse(lsGet(LS_DATA)||'null');if(d)D=normalizar(d)}catch(e){}
  if(D)render();
  if(API){if(!D)$('#main').innerHTML='<div class="empty">Cargando tus datos…</div>';cargar(!!D)}else if(!D)pantallaInicial();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
